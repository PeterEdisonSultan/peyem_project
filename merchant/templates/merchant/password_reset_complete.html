{% extends "base.html" %}
{% block nav_links %}{% endblock %}
{% block title %}Succès{% endblock %}

{% block content %}
<style>body { background-color: #f8f9fa; } .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); background-color: #ffffff; }</style>

<div class="container py-5 min-vh-100 d-flex flex-column justify-content-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4"><h2 class="fw-bold text-dark">PEYEM</h2></div>
            <div class="card login-card p-5 text-center">
                <div class="mb-4 text-primary">
                    <i class="bi bi-check-circle-fill" style="font-size: 3rem;"></i>
                </div>
                <h4 class="fw-bold">Mot de passe modifié !</h4>
                <p class="text-muted my-3">
                    Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.
                </p>
                <a href="{% url 'merchant_login' %}" class="btn btn-primary btn-lg w-100 mt-3">Se connecter</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
